<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이용 기록</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header><strong>BOWLIO · 레인/이용 관리</strong><nav><a th:href="@{/lanes}">레인 현황</a><a th:href="@{/usages}">이용 기록</a></nav></header>
<main><h1>실제 이용 기록</h1><p class="muted">예약된 레인별 실제 시작·종료 시간을 기록합니다.</p>
<div th:if="${message}" class="notice" th:text="${message}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
<div class="panel" style="overflow:auto"><table><thead><tr><th>기록</th><th>예약</th><th>레인</th><th>회원</th><th>시작</th><th>종료</th><th>상태</th><th>작업</th></tr></thead><tbody>
<tr th:each="u : ${usages}"><td th:text="${u.usageId}"></td><td th:text="${u.reservationId}"></td><td th:text="|${u.laneNumber}번|"></td><td th:text="${u.memberName}"></td>
<td th:text="${u.actualStartTime == null ? '-' : #temporals.format(u.actualStartTime,'yyyy-MM-dd HH:mm')}"></td>
<td th:text="${u.actualEndTime == null ? '-' : #temporals.format(u.actualEndTime,'yyyy-MM-dd HH:mm')}"></td>
<td th:text="${u.usageStatus}"></td><td><form th:if="${u.usageStatus == '이용중'}" method="post" th:action="@{/usages/{id}/end(id=${u.usageId})}"><button type="submit">이용 종료</button></form></td></tr>
<tr th:if="${#lists.isEmpty(usages)}"><td colspan="8">아직 이용 기록이 없습니다.</td></tr>
</tbody></table></div><footer>3번 담당 독립 개발 데모</footer></main></body></html>
