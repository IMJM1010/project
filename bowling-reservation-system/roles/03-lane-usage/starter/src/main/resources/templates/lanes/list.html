<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOWLIO</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><strong>BOWLIO · 레인/이용 관리</strong><nav><a th:href="@{/lanes}">레인 현황</a><a th:href="@{/usages}">이용 기록</a><form method="post" th:action="@{/logout}"><button>로그아웃</button></form></nav></header><main><h1>레인 현황</h1><p>현재 시설 상태와 시간대별 예약 가능 여부는 다릅니다.</p><div class="grid"><a class="card" th:each="lane : ${lanes}" th:href="@{/lanes/{id}(id=${lane.laneId})}"><div class="num" th:text="|${lane.laneNumber}번|"></div><strong th:text="${lane.label()}"></strong><p th:text="${#temporals.format(lane.updatedAt,'MM-dd HH:mm')}"></p></a></div></main></body></html>
