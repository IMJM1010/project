<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레인 현황</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header><strong>BOWLIO · 레인/이용 관리</strong><nav><a th:href="@{/lanes}">레인 현황</a><a th:href="@{/usages}">이용 기록</a></nav></header>
<main><h1>레인 현황</h1><p class="muted">시설 상태와 현재 이용 여부는 별도입니다. 레인을 선택하면 예약·이용 상세정보를 확인할 수 있습니다.</p>
<div class="grid"><a class="card" th:each="lane : ${lanes}" th:href="@{/lanes/{id}(id=${lane.laneId})}">
<div class="row"><div class="num" th:text="|${lane.laneNumber}번|">1번</div><span class="pill" th:classappend="${lane.occupied} ? 'warn' : 'good'" th:text="${lane.occupied} ? '이용 중' : '미점유'">미점유</span></div>
<p>시설 상태: <strong th:text="${lane.laneStatus}">이용가능</strong></p><small>상세보기 및 상태 변경 →</small></a></div>
<footer>3번 담당 독립 개발 데모 · 실제 예약 등록 기능은 2번과 연동 예정</footer></main></body></html>
