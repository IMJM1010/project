<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레인 상세</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body>
<header><strong>BOWLIO · 레인/이용 관리</strong><nav><a th:href="@{/lanes}">레인 현황</a><a th:href="@{/usages}">이용 기록</a></nav></header>
<main><p><a th:href="@{/lanes}">← 전체 레인</a></p><h1 th:text="|${lane.laneNumber}번 레인|">1번 레인</h1>
<div th:if="${message}" class="notice" th:text="${message}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div>
<section class="panel"><div class="row"><div><h2>시설 상태</h2><p class="muted">현재: <strong th:text="${lane.laneStatus}"></strong> · 점유: <strong th:text="${lane.occupied} ? '이용 중' : '미점유'"></strong></p></div>
<form method="post" th:action="@{/lanes/{id}/status(id=${lane.laneId})}"><select name="status"><option value="이용가능" th:selected="${lane.laneStatus == '이용가능'}">이용가능</option><option value="점검중" th:selected="${lane.laneStatus == '점검중'}">점검중</option><option value="사용불가" th:selected="${lane.laneStatus == '사용불가'}">사용불가</option></select><button type="submit">상태 변경</button></form></div></section>
<h2>배정된 예약 및 이용 시작</h2><div class="panel" style="overflow:auto"><table><thead><tr><th>예약번호</th><th>회원</th><th>예약 시작</th><th>예약 종료</th><th>예약 상태</th><th>이용 상태 / 작업</th></tr></thead><tbody>
<tr th:each="s : ${schedules}"><td th:text="${s.reservationId}"></td><td th:text="${s.memberName}"></td><td th:text="${#temporals.format(s.startTime,'MM-dd HH:mm')}"></td><td th:text="${#temporals.format(s.endTime,'MM-dd HH:mm')}"></td><td th:text="${s.reservationStatus}"></td><td><span th:if="${s.usageStatus != null}" th:text="${s.usageStatus}"></span><form th:if="${s.usageStatus == null or s.usageStatus == '대기'}" method="post" th:action="@{/usages/start}"><input type="hidden" name="reservationId" th:value="${s.reservationId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><button type="submit">이용 시작</button></form></td></tr>
<tr th:if="${#lists.isEmpty(schedules)}"><td colspan="6">배정된 예약이 없습니다. 데모 모드에는 예제 예약이 포함됩니다.</td></tr></tbody></table></div>
<p class="muted">이용 종료 버튼은 <a th:href="@{/usages}">이용 기록</a> 화면에 있습니다.</p></main></body></html>
