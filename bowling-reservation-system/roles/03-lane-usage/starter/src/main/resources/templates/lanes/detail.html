<!doctype html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOWLIO</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header><strong>BOWLIO · 레인/이용 관리</strong><nav><a th:href="@{/lanes}">레인 현황</a><a th:href="@{/usages}">이용 기록</a><form method="post" th:action="@{/logout}"><button>로그아웃</button></form></nav></header><main><div th:if="${message}" class="notice" th:text="${message}"></div><div th:if="${error}" class="notice error" th:text="${error}"></div><h1 th:text="|${lane.laneNumber}번 레인|"></h1><section class="panel"><h2 th:text="${lane.label()}"></h2><p th:text="${#temporals.format(lane.updatedAt,'yyyy-MM-dd HH:mm')}"></p>
<form method="post" th:if="${lane.laneStatus != 'MAINTENANCE'}" th:action="@{/lanes/{id}/status(id=${lane.laneId})}"><input type="hidden" name="status" value="MAINTENANCE"><button>고장 및 점검 처리</button></form>
<form method="post" th:if="${lane.laneStatus == 'MAINTENANCE'}" th:action="@{/lanes/{id}/status(id=${lane.laneId})}"><input type="hidden" name="status" value="AVAILABLE"><button>점검 완료</button></form></section>
<h2>배정 예약</h2><section class="panel" th:each="s : ${schedules}"><h3 th:text="|${s.reservationId} · ${s.memberName}|"></h3><p><span th:text="${#temporals.format(s.startTime,'MM-dd HH:mm')}"></span> ~ <span th:text="${#temporals.format(s.endTime,'MM-dd HH:mm')}"></span></p><p th:text="|${s.reservationStatus} / ${s.usageStatus}|"></p><p th:text="|예약 인원 ${s.personCount}명 / 방문 인원 ${s.actualPersonCount == null ? '미확인' : s.actualPersonCount}|"></p>
<div th:if="${s.reservationStatus == 'CONFIRMED' or s.reservationStatus == 'IN_USE'}">
<form method="post" th:action="@{/usages/attendance}"><input type="hidden" name="reservationId" th:value="${s.reservationId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><input name="actualPersonCount" type="number" min="1" max="40" required><button>방문 인원 확인</button></form>
<div th:if="${s.usageStatus == 'WAITING'}"><form method="post" th:action="@{/usages/start}"><input type="hidden" name="reservationLaneId" th:value="${s.reservationLaneId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><button th:disabled="${lane.laneStatus != 'AVAILABLE'}">이용 시작</button></form><form method="post" th:action="@{/usages/unused}"><input type="hidden" name="reservationLaneId" th:value="${s.reservationLaneId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><button>미사용 처리</button></form></div>
<div th:if="${s.reservationStatus == 'IN_USE'}"><form method="post" th:action="@{/usages/extend}"><input type="hidden" name="reservationId" th:value="${s.reservationId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><input type="number" min="1" max="120" name="minutes" value="30" required><button>전체 연장(분)</button></form><form method="post" th:action="@{/usages/add-lane}"><input type="hidden" name="reservationId" th:value="${s.reservationId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><select name="newLaneId"><option th:each="l : ${lanes}" th:if="${l.laneStatus == 'AVAILABLE'}" th:value="${l.laneId}" th:text="|${l.laneNumber}번|"></option></select><button>추가 배정 및 시작</button></form><form method="post" th:action="@{/usages/finish-reservation}"><input type="hidden" name="reservationId" th:value="${s.reservationId}"><input type="hidden" name="laneId" th:value="${lane.laneId}"><button>예약 전체 종료</button></form></div></div></section>
<p>개별 이용 종료는 <a th:href="@{/usages}">이용 기록</a>에서 처리합니다.</p></main></body></html>
