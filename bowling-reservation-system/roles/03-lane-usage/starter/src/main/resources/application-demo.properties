spring.datasource.url=jdbc:h2:mem:bowling-${random.uuid};MODE=Oracle;DATABASE_TO_UPPER=true;NON_KEYWORDS=USAGE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2-schema.sql
spring.sql.init.data-locations=classpath:db/h2-data.sql
spring.sql.init.encoding=UTF-8
bowling.usage.enforce-time-window=false
server.address=127.0.0.1
bowling.demo.admin-password=${DEMO_ADMIN_PASSWORD:local-demo-only}
