spring.datasource.url=jdbc:h2:mem:bowling;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true;NON_KEYWORDS=USAGE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2-schema.sql
spring.sql.init.data-locations=classpath:db/h2-data.sql
spring.sql.init.encoding=UTF-8
bowling.usage.id-sql=SELECT NEXT VALUE FOR USAGE_SEQ
bowling.usage.enforce-time-window=false
