<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신규 회원 등록</title>
</head>
<body>
    <h1>신규 회원 등록</h1>
    <p th:if="${errorMessage}" th:text="${errorMessage}" style="color:red;"></p>
    <form th:action="@{/members}" method="post">
        <div>이름(필수): <input type="text" name="name" required></div>
        <div>연락처(필수): <input type="text" name="phone" required placeholder="010-0000-0000"></div>
        <div>이메일: <input type="email" name="email"></div>
        <div>등급: 
            <select name="grade">
                <option value="NORMAL">NORMAL</option>
                <option value="VIP">VIP</option>
            </select>
        </div>
        <button type="submit">등록</button>
        <a th:href="@{/members}">취소</a>
    </form>
</body>
</html>
