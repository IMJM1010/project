spring.application.name=bowling-member

# Oracle DB 연결 (환경변수 관리 - 실제 계정정보 직접 입력 금지)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:your_oracle_username}
spring.datasource.password=${DB_PASSWORD:your_oracle_password}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Thymeleaf 설정
spring.thymeleaf.cache=false